<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960">
  <!-- 衣橱 · 卡片封面
       版式仿照图库 / 邮件 / 陪看三卡：
       米色底铺满 + 棕色粗线衣架（居中上部）+ 底部超大黑字「衣橱」+ 铜色短线点缀。
       无渐变、无点阵、无外框——和那三张同一套语言。 -->
  <rect width="720" height="960" fill="#F2E9D6"/>

  <!-- 衣架：棕色粗线，整体上移对齐邮件版式（icon 中心 ≈ 卡高 30%） -->
  <g transform="translate(0,-36)">
    <g fill="none" stroke="#8B6242" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="360" cy="212" r="36"/>
      <path d="M360 248 L360 344"/>
      <path d="M360 344 C238 344 184 424 184 496"/>
      <path d="M360 344 C482 344 536 424 536 496"/>
    </g>
    <!-- 横杆：暗铜（品牌锚点，类比邮件的红色蜡封点缀） -->
    <line x1="184" y1="496" x2="536" y2="496" stroke="#9C6B3F" stroke-width="26" stroke-linecap="round"/>
  </g>

  <!-- 底部大字：字号对齐图库/邮件/陪看（字宽约占卡宽 60%），baseline ≈ 卡高 78%，下方留白 18% -->
  <text x="372" y="750" text-anchor="middle"
        font-family="'Source Han Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif"
        font-size="200" font-weight="900" fill="#1A1816" letter-spacing="24">衣橱</text>
  <!-- 字下铜色线：粗 16，与字留 24px 间距 -->
  <rect x="140" y="774" width="440" height="16" rx="8" fill="#9C6B3F"/>
</svg>
